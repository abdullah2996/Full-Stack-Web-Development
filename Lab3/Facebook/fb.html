<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook | Home Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="fb.css">
</head>

<body>

    <nav class="navbar navbar-expand bg-white shadow-sm px-4">

        <div class="container-fluid">

            <div class="d-flex align-items-center gap-3">

                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg"
                    alt="Facebook Logo"
                    class="nav-logo"
                >

                <input
                    type="text"
                    class="form-control search-box"
                    placeholder="Search Facebook"
                >

            </div>


            <div class="d-flex gap-4">

                <a href="#" class="nav-link fw-bold text-primary">
                    Home
                </a>

                <a href="#" class="nav-link fw-bold text-primary">
                    My Profile
                </a>

            </div>

        </div>

    </nav>


    <main class="container">

        <div class="row justify-content-center align-items-center g-5 main-section">

            <div class="col-lg-5 text-center text-lg-start">

                <h1 class="fb-heading fw-bold">
                    facebook
                </h1>

                <p class="fb-tagline">
                    Facebook helps you connect and share with the people in your life.
                </p>

            </div>


            <div class="col-lg-4">

                <div class="login-box bg-white shadow rounded p-3">

                    <input
                        type="text"
                        class="form-control login-input"
                        placeholder="Email address or phone number"
                    >

                    <input
                        type="password"
                        class="form-control login-input"
                        placeholder="Password"
                    >

                    <button class="btn btn-primary w-100 login-btn">
                        Log In
                    </button>

                    <a href="#" class="forgot-link">
                        Forgotten password?
                    </a>

                    <hr>

                    <button class="btn create-account-btn">
                        Create New Account
                    </button>

                </div>


                <p class="create-page-text text-center">
                    <b>Create a Page</b> for a celebrity, brand or business.
                </p>

            </div>

        </div>

    </main>


    <footer class="container-fluid footer">

        <hr>

        <div class="d-flex flex-wrap justify-content-center gap-3 footer-links">

            <a href="#">English (US)</a>
            <a href="#">اردو</a>
            <a href="#">हिन्दी</a>
            <a href="#">Sign Up</a>
            <a href="#">Log In</a>
            <a href="#">Messenger</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>

        </div>

        <p class="text-center copyright">
            Facebook Clone &copy; 2026 Abdullah | Full Stack Web Dev 
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
