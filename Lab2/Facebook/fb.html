<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facebook</title>
    <link rel="stylesheet" href="fb.css">
</head>
<body>

    <!-- top navbar -->
    <header class="navbar">
        <div class="nav-left">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="fb logo" class="nav-logo">
            <input type="text" class="search-box" placeholder="Search Facebook">
        </div>
        <div class="nav-right">
            <p>Home</p>
            <p>My Profile</p>
        </div>
    </header>

    <!-- main content -->
    <div class="main-container">

        <!-- left side -->
        <div class="left-side">
            <h1 class="fb-heading">facebook</h1>
            <p class="fb-tagline">
                Facebook helps you connect and share with the people in your life.
            </p>
        </div>

        <!-- right side login box -->
        <div class="right-side">
            <div class="login-box">
                <input type="text" placeholder="Email address or phone number" class="login-input">
                <input type="password" placeholder="Password" class="login-input">
                <button class="login-btn">Log In</button>
                <a href="#" class="forgot-link">Forgotten password?</a>

                <hr>

                <button class="create-account-btn">Create New Account</button>
            </div>

            <p class="create-page-text">
                <b>Create a Page</b> for a celebrity, brand or business.
            </p>
        </div>

    </div>

    <!-- footer -->
    <footer class="footer">
        <hr>
        <div class="footer-links">
            <a href="#">English (US)</a>
            <a href="#">اردو</a>
            <a href="#">हिन्दी</a>
            <a href="#">Sign Up</a>
            <a href="#">Log In</a>
            <a href="#">Messenger</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
        <p class="copyright">Facebook Clone &copy; 2026 Abdullah | Full Stack Web Dev Lab Task 2</p>
    </footer>

</body>
</html>
